name: Enforce Admin-Only Labeling

on:
  pull_request_target:
    types: [labeled]

jobs:
  check-label-permission:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Check if actor is an admin
        id: check_admin
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const actor = context.payload.sender.login;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get the actor's permission level
            const { data: permData } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: actor,
            });

            const permission = permData.permission;
            console.log(`Actor: ${actor}, Permission: ${permission}`);

            // Only 'admin' is allowed to label
            if (permission !== 'admin') {
              const labelName = context.payload.label.name;
              const prNumber = context.payload.pull_request.number;

              console.log(`Removing label "${labelName}" added by non-admin "${actor}"`);

              // Remove the label
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: prNumber,
                name: labelName,
              });

              // Post a comment explaining why
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `⚠️ @${actor} — only repository admins are permitted to add labels to pull requests. The label **"${labelName}"** has been removed.`,
              });
            } else {
              console.log(`Actor "${actor}" is an admin. Label is allowed.`);
            }
